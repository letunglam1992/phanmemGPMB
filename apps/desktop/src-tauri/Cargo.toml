[package]
name = "gpmb-sonla"
version = "0.1.0"
description = "Phần mềm hỗ trợ bồi thường, hỗ trợ, tái định cư – Sơn La"
edition = "2021"

[lib]
name = "gpmb_sonla_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Máy chủ mạng nội bộ (docs/11): HTTPS tự ký, SQLite, băm mật khẩu PBKDF2
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "signal"] }
axum = { version = "0.7", default-features = false, features = ["http1", "json", "query", "tokio"] }
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
rusqlite = { version = "0.32", features = ["bundled"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"
getrandom = "0.2"
ureq = { version = "2", default-features = false, features = ["tls"] }
if-addrs = "0.13"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# băm mật khẩu chạy nhanh cả ở bản dev/kiểm thử
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
