[package]
name = "gpmb-sonla"
version = "0.1.0"
description = "Phần mềm hỗ trợ bồi thường, hỗ trợ, tái định cư – Sơn La"
edition = "2021"

[lib]
name = "gpmb_sonla_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
