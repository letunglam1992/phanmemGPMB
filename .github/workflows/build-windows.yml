name: Kiểm thử và đóng gói Windows

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  kiem-thu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  dong-goi-windows:
    needs: kiem-thu
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - name: Build bộ cài NSIS (.exe)
        working-directory: apps/desktop
        run: npx tauri build --bundles nsis
      - name: Kiểm thử vỏ Rust (sao lưu tự động, máy chủ mạng nội bộ đầu–cuối)
        working-directory: apps/desktop/src-tauri
        run: cargo test
      - uses: actions/upload-artifact@v4
        with:
          name: gpmb-sonla-windows-setup
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
