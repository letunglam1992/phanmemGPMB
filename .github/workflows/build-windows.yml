name: Kiểm thử và đóng gói Windows

on:
  push:
    branches: ["main", "claude/**"]
    # Nhãn phiên bản (vd. v0.9.15) → phát hành bản cập nhật có chữ ký lên GitHub Releases (job phat-hanh)
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      phat_hanh:
        description: "Phát hành bản cập nhật (tạo nhãn vX.Y.Z theo phiên bản trong tauri.conf.json, đăng GitHub Release có chữ ký)"
        type: boolean
        default: false

jobs:
  kiem-thu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: ESLint (hook React, catch rỗng, biến không dùng)
        run: npm -w @gpmb/desktop run lint
      - run: npm test

  giao-dien:
    # Kiểm thử giao diện Playwright (P1-9): kịch bản Giai đoạn 1 trên bản build, Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/desktop
      - run: npm -w @gpmb/desktop run e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-ket-qua
          path: apps/desktop/test-results

  dong-goi-windows:
    needs: [kiem-thu, giao-dien]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - name: Build bộ cài NSIS (.exe)
        working-directory: apps/desktop
        run: npx tauri build --bundles nsis
      - name: Kiểm thử vỏ Rust (sao lưu tự động, máy chủ mạng nội bộ đầu–cuối)
        working-directory: apps/desktop/src-tauri
        run: cargo test
      - uses: actions/upload-artifact@v4
        with:
          name: gpmb-sonla-windows-setup
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  phat-hanh:
    # Bản cập nhật trong phần mềm (docs/09 "Cập nhật phần mềm"): build bộ cài NSIS, ký bằng khóa bí mật trong Secrets,
    # đăng lên GitHub Releases kèm latest.json — phần mềm đã cài tự tìm thấy và cài đè (giữ dữ liệu).
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.phat_hanh)
    needs: [kiem-thu, giao-dien]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm tra nhãn khớp phiên bản, đã có khóa ký
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          pb=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            [ "v$pb" = "$GITHUB_REF_NAME" ] || { echo "::error::Nhãn $GITHUB_REF_NAME khác phiên bản $pb trong tauri.conf.json"; exit 1; }
          fi
          echo "NHAN=v$pb" >> "$GITHUB_ENV"
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || { echo "::error::Chưa có secret TAURI_SIGNING_PRIVATE_KEY"; exit 1; }
          [ -s apps/desktop/src-tauri/khoa-cap-nhat.pub ] || { echo "::error::Chưa có khóa công khai apps/desktop/src-tauri/khoa-cap-nhat.pub"; exit 1; }
          { echo 'NOI_DUNG<<HET_NOI_DUNG'; git log -1 --format=%B | grep -v -E '^(Co-Authored-By|Claude-Session):'; echo 'HET_NOI_DUNG'; } >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: npx tauri
          args: --bundles nsis --config src-tauri/tauri.phat-hanh.conf.json
          tagName: ${{ env.NHAN }}
          releaseName: GPMB Sơn La ${{ env.NHAN }}
          releaseCommitish: ${{ github.sha }}
          releaseBody: ${{ env.NOI_DUNG }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
